<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>GeoIP Tracker – Cyber Siksha</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css" />

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html,
        body {
            height: 100%;
            background-color: #000;
            font-family: 'Segoe UI', sans-serif;
            color: white;
            overflow-x: hidden;
        }

        body::before {
            content: "";
            position: fixed;
            top: var(--y, 50%);
            left: var(--x, 50%);
            width: 1500px;
            height: 1500px;
            background: radial-gradient(circle at center, #ff00cc, #3333ff, #00ffcc);
            opacity: 0.15;
            transform: translate(-50%, -50%);
            filter: blur(180px);
            transition: 0.1s ease-out;
            z-index: 0;
            pointer-events: none;
        }

        .container {
            max-width: 700px;
            margin: auto;
            margin-top: 8vh;
            padding: 30px;
            background: rgba(20, 20, 40, 0.9);
            border-radius: 12px;
            box-shadow: 0 0 20px rgba(0, 255, 255, 0.2);
            text-align: center;
            position: relative;
            z-index: 1;
        }

        h1 {
            font-size: 28px;
            color: #84e8f0;
            margin-bottom: 20px;
        }

        form {
            margin-bottom: 20px;
        }

        input[type="text"] {
            padding: 12px;
            width: 80%;
            font-size: 16px;
            border: none;
            border-radius: 6px;
            outline: none;
        }

        button {
            padding: 12px 25px;
            background: #0077cc;
            border: none;
            border-radius: 6px;
            color: white;
            font-size: 16px;
            cursor: pointer;
            margin-left: 10px;
        }

        button:hover {
            background: #005fa3;
        }

        #map {
            height: 400px;
            width: 100%;
            border-radius: 10px;
            margin-top: 20px;
        }

        .info {
            margin-top: 20px;
            font-size: 16px;
            line-height: 1.6;
        }

        .back-button {
            position: fixed;
            top: 20px;
            left: 20px;
            padding: 10px 14px;
            background: #0077cc;
            color: white;
            text-decoration: none;
            border-radius: 8px;
            z-index: 5;
        }

        .back-button:hover {
            background: #005fa3;
        }

        @media (max-width: 600px) {
            .container {
                width: 90%;
                padding: 20px;
                margin-top: 10vh;
            }

            input[type="text"],
            button {
                width: 100%;
                margin-top: 10px;
            }

            button {
                margin-left: 0;
            }
        }
    </style>

    <script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>
</head>

<body onmousemove="moveGradient(event)">

    <a class="back-button" href="main.html">← Back</a>

    <div class="container">
        <h1>📍 IP Geo Tracker</h1>
        <form onsubmit="lookupIP(event)">
            <input type="text" id="ipInput" placeholder="Enter IP address (e.g. 8.8.8.8)" required>
            <button type="submit">🔍 Track</button>
        </form>

        <div id="map"></div>
        <div class="info" id="info-box"></div>
    </div>

    <script>
        let map, marker;

  function moveGradient(e) {
    const x = e.clientX || window.innerWidth / 2;
    const y = e.clientY || window.innerHeight / 2;
    document.body.style.setProperty('--x', `${x}px`);
    document.body.style.setProperty('--y', `${y}px`);
  }

  function lookupIP(event) {
    event.preventDefault();

    const ip = document.getElementById("ipInput").value.trim();
    const token = "c7c76c6cd19fca";
    const url = `https://ipinfo.io/${ip}/json?token=${token}`;
    document.getElementById("info-box").innerHTML = "Fetching location...";

    fetch(url)
      .then(response => response.json())
      .then(data => {
        if (!data.loc) throw new Error("Invalid IP or no location data.");

        const [lat, lon] = data.loc.split(",");

        if (!map) {
          map = L.map('map').setView([lat, lon], 10);
          L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OpenStreetMap contributors'
          }).addTo(map);
          marker = L.marker([lat, lon]).addTo(map);
        } else {
          map.setView([lat, lon], 10);
          marker.setLatLng([lat, lon]);
        }

        marker.bindPopup(`<b>${data.ip}</b><br>${data.city}, ${data.region}`).openPopup();

        const infoHTML = `
          <p><strong>IP:</strong> ${data.ip}</p>
          <p><strong>City:</strong> ${data.city}</p>
          <p><strong>Region:</strong> ${data.region}</p>
          <p><strong>Country:</strong> ${data.country}</p>
          <p><strong>Org:</strong> ${data.org}</p>
          <p><strong>Coordinates:</strong> ${data.loc}</p>
          <p><strong>Timezone:</strong> ${data.timezone}</p>
        `;

        document.getElementById("info-box").innerHTML = infoHTML;
      })
      .catch(error => {
        document.getElementById("info-box").innerHTML =
          `<p style='color:red;'>❌ Failed to find IP: ${error.message}</p>`;
        document.getElementById("map").innerHTML = "";
        console.error(error);
      });
  }
    </script>

</body>

</html>
