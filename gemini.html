<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Gemini Chatbot</title>
  <style>
    body { font-family: Arial; padding: 20px; background: #f2f2f2; }
    #chat-box { border: 1px solid #ccc; background: white; padding: 10px; height: 300px; overflow-y: scroll; margin-bottom: 10px; }
    .msg { margin: 5px 0; }
    .user { font-weight: bold; color: blue; }
    .bot { font-weight: bold; color: green; }
  </style>
</head>
<body>
  <h2>Gemini Chatbot</h2>
  <div id="chat-box"></div>
  <input type="text" id="user-input" placeholder="Type your message..." />
  <button onclick="sendMessage()">Send</button>

  <script>
    async function sendMessage() {
      const input = document.getElementById('user-input');
      const message = input.value.trim();
      if (!message) return;

      appendMessage('You', message, 'user');
      input.value = '';

      try {
        const response = await fetch('chat.php', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json'
          },
          body: JSON.stringify({ message })
        });

        if (!response.ok) throw new Error('Fetch failed');

        const data = await response.json();
        appendMessage('Bot', data.reply, 'bot');
      } catch (error) {
        appendMessage('Bot', '❌ Could not connect to the server. Check your PHP or server setup.', 'bot');
      }
    }

    function appendMessage(sender, text, cls) {
      const chatBox = document.getElementById('chat-box');
      const div = document.createElement('div');
      div.className = `msg ${cls}`;
      div.textContent = `${sender}: ${text}`;
      chatBox.appendChild(div);
      chatBox.scrollTop = chatBox.scrollHeight;
    }
  </script>
</body>
</html>
