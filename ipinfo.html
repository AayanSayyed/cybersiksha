<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>IP Info – Cyber Siksha</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html,
        body {
            height: 100%;
            font-family: 'Segoe UI', sans-serif;
            background-color: #000;
            color: white;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
        }

        body::before {
            content: "";
            position: fixed;
            top: var(--y, 50%);
            left: var(--x, 50%);
            width: 1500px;
            height: 1500px;
            background: radial-gradient(circle at center, #ff00cc, #3333ff, #00ffcc);
            opacity: 0.15;
            transform: translate(-50%, -50%);
            filter: blur(180px);
            transition: 0.1s ease-out;
            pointer-events: none;
            z-index: 0;
        }

        .container {
            max-width: 600px;
            width: 90%;
            background: rgba(20, 20, 40, 0.9);
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 0 20px rgba(0, 255, 255, 0.2);
            text-align: center;
            z-index: 1;
        }

        h1 {
            font-size: 28px;
            color: #84e8f0;
            margin-bottom: 20px;
        }

        .info-box {
            text-align: left;
            font-size: 16px;
            line-height: 1.6;
            margin-top: 10px;
        }

        .info-box p {
            margin: 6px 0;
        }

        .back-button {
            position: fixed;
            top: 20px;
            left: 20px;
            padding: 10px 14px;
            background: #0077cc;
            color: white;
            text-decoration: none;
            border-radius: 8px;
            z-index: 2;
        }

        .back-button:hover {
            background: #005fa3;
        }

        @media (max-width: 600px) {
            h1 {
                font-size: 22px;
            }

            .back-button {
                font-size: 14px;
                padding: 8px 12px;
            }
        }
    </style>
</head>

<body onmousemove="moveGradient(event)">

    <a class="back-button" href="main.html">← Back</a>

    <div class="container">
        <h1>🌍 Your IP Information</h1>
        <div class="info-box" id="ip-info">
            <p>Loading...</p>
        </div>
    </div>

    <script>
        function moveGradient(e) {
    const x = e.clientX || window.innerWidth / 2;
    const y = e.clientY || window.innerHeight / 2;
    document.body.style.setProperty('--x', `${x}px`);
    document.body.style.setProperty('--y', `${y}px`);
  }

  const token = "c7c76c6cd19fca"; // Your working token
  fetch(`https://ipinfo.io/json?token=${token}`)
    .then(response => {
      if (!response.ok) throw new Error("HTTP error " + response.status);
      return response.json();
    })
    .then(data => {
      const info = `
        <p><strong>IP Address:</strong> ${data.ip}</p>
        <p><strong>City:</strong> ${data.city}</p>
        <p><strong>Region:</strong> ${data.region}</p>
        <p><strong>Country:</strong> ${data.country}</p>
        <p><strong>Location:</strong> ${data.loc}</p>
        <p><strong>ISP:</strong> ${data.org}</p>
        <p><strong>Timezone:</strong> ${data.timezone}</p>
      `;
      document.getElementById("ip-info").innerHTML = info;
    })
    .catch(error => {
      document.getElementById("ip-info").innerHTML = "<p style='color:red;'>Unable to fetch IP info. Check your network or try again later.</p>";
      console.error(error);
    });
    </script>

</body>

</html>
